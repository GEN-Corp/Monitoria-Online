<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monitoria Online</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        nav {
            background: #1f2937;
            color: white;
            padding: 16px 32px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .logout-button {
            width: auto;
            margin: 0;
            padding: 6px 12px;
            background: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 5px;
        }

        .logout-button:hover {
            background: white;
            color: #1f2937;
        }
    </style>
</head>

<body>

    {% if user.is_authenticated %}

        <nav>

            <strong>
                Monitoria Online
            </strong>

            <span>

                {{ user.username }}

                |

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    style="display: inline;"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="logout-button"
                    >
                        Sair
                    </button>

                </form>

            </span>

        </nav>

    {% endif %}


    <div class="container">

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
