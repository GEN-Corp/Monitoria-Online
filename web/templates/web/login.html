{% extends "web/base.html" %}

{% block content %}

<div class="card">

    <h1>Monitoria Online</h1>

    <p>Entre na sua conta</p>

    {% if error %}
        <p role="alert">{{ error }}</p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label for="email">E-mail</label>
        <input
            type="email"
            name="email"
            id="email"
            autocomplete="email"
            required
        >

        <label for="password">Senha</label>
        <input
            type="password"
            name="password"
            id="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <p>
    Não possui uma conta?
    <a href="{% url 'register' %}">
        Criar conta
    </a>
    </p>

</div>

{% endblock %}
