{% extends "web/base.html" %}

{% block content %}

<div class="card">

    <h1>Criar conta</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Criar conta
        </button>
    </form>
    <p>O cadastro público cria uma conta de aluno. Professores e monitores são provisionados pela equipe.</p>

    <p>
        Já possui uma conta?
        <a href="{% url 'login' %}">
            Entrar
        </a>
    </p>

</div>

{% endblock %}
