{% extends "web/base.html" %}

{% block content %}

<div class="card">

    <h1>Criar conta</h1>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Usuário</label>
        <input
            type="text"
            name="username"
            required
        >

        <label>Nome</label>
        <input
            type="text"
            name="first_name"
            required
        >

        <label>Sobrenome</label>
        <input
            type="text"
            name="last_name"
        >

        <label>E-mail</label>
        <input
            type="email"
            name="email"
            required
        >

        <label>Tipo de usuário</label>

        <select name="tipo" required>
            <option value="ALUNO">Aluno</option>
            <option value="MONITOR">Monitor</option>
            <option value="PROFESSOR">Professor</option>
        </select>

        <p>
            
        <label>Senha</label>
        <input
            type="password"
            name="password"
            required
        >

        <label>Confirmar senha</label>
        <input
            type="password"
            name="password_confirm"
            required
        >

        <button type="submit">
            Criar conta
        </button>

    </form>

    <p>
        Já possui uma conta?
        <a href="{% url 'login' %}">
            Entrar
        </a>
    </p>

</div>

{% endblock %}
